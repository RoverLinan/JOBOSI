sql.table1.select.all= SELECT \
COD_EMPRESA, \
  COD_ATENCION, \
  FEC_CREACION, \
  COD_CANAL, \
  COD_TIP_DOCUMENTO, \
  NRO_DOCTO_IDENT, \
  NOMBRE_RAZON_SOCIAL, \
  APELLIDO_SOLICITANTE, \
  NUM_SUMINISTRO, \
  EMAIL_SOLICITANTE, \
  TELEF_SOLICITANTE, \
  DIRECCION, \
  UBIGEO, \
  COD_ASUNTO, \
  FEC_SOLUCION, \
  DESCRIPCION_RECLAMO, \
  COD_ESTADO, \
  TIP_ATENCION, \
  COD_DISTRITO \
FROM WCLIENTE.OSI_TABLA1 WHERE (OSI_ESTADO IS NULL OR OSI_ESTADO = 'PENDIENTE' OR OSI_ESTADO = 'ERROR') AND OSI_NUM_REINTENTO < 3 OFFSET ? ROWS FETCH NEXT ? ROWS ONLY


sql.table1.select.count.all=SELECT COUNT(*) AS TOTAL FROM WCLIENTE.OSI_TABLA1 WHERE (OSI_ESTADO IS NULL OR OSI_ESTADO = 'PENDIENTE' OR OSI_ESTADO = 'ERROR') AND OSI_NUM_REINTENTO < 3

sql.table1.update= UPDATE WCLIENTE.OSI_TABLA1 SET OSI_ESTADO = ?, OSI_NUM_REINTENTO = OSI_NUM_REINTENTO + 1, OSI_FEC_ENVIO = ?  WHERE  COD_EMPRESA = ? AND COD_ATENCION = ? AND NUM_SUMINISTRO = ?

