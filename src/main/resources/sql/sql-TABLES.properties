sql.errorOsi.insert= INSERT INTO WCLIENTE.OSI_ERRORES_REMISION (\
  UUID_ERROR, \
  NOMBRE_TABLA, \
  COD_ATENCION, \
  COD_ACCION, \
  MENSAJE_ERROR, \
  TIPO_ERROR, \
  CAMPO_ERRONEO, \
  CODIGO_ERROR_EXTERNO, \
  FECHA_ERROR, \
  ESTADO_ERROR, \
  COMENTARIOS_ADICIONALES, \
  USUARIO) \
  VALUES(?, ?,  ?,  ?,  ?,  ?,  ?,  ?,  ?,  ?,  ?,  ?)